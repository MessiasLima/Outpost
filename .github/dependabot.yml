version: 2

updates:
  # gradle/libs.versions.toml + gradle/wrapper/gradle-wrapper.properties
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # .github/workflows/*
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
