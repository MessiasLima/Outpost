[versions]
agp = "9.4.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
activity = "1.13.0"
appcompat = "1.7.1"
buildKonfig = "0.23.0"
core = "1.19.0"
espresso = "3.7.0"
lifecycle = "2.11.0"
testExt = "1.3.0"
compose = "1.12.1"
compose-adaptive = "1.3.0-beta02"
detekt = "1.23.8"
junit = "4.13.2"
kermit = "2.2.0"
koin = "4.2.2"
koin-compiler = "1.2.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"
material3 = "1.12.0-alpha03"
navigation3 = "1.1.1"
orbit = "12.0.1"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
testExt-junit = { module = "androidx.test.ext:junit", version.ref = "testExt" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
